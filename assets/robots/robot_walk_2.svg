<?xml version="1.0" encoding="UTF-8"?>
<svg width="24" height="36" viewBox="0 0 24 36" xmlns="http://www.w3.org/2000/svg">
  <!-- Shadow -->
  <ellipse cx="12" cy="33" rx="8" ry="2" fill="#00000030"/>
  
  <!-- Left leg - mid-lift with corrugated tube -->
  <path d="M 7 24 Q 7 25.5 7 27.5 L 7 29" fill="none" stroke="#5A6169" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="7" cy="25.5" r="1.5" fill="#374151"/>
  <!-- Corrugation lines -->
  <path d="M 6.2 24.5 Q 7 24.5 7.8 24.5" fill="none" stroke="#8B92A0" stroke-width="0.5" opacity="0.8"/>
  <path d="M 6.5 25.8 Q 7 25.8 7.5 25.8" fill="none" stroke="#8B92A0" stroke-width="0.5" opacity="0.8"/>
  <path d="M 6.5 27 Q 7 27 7.5 27" fill="none" stroke="#8B92A0" stroke-width="0.5" opacity="0.8"/>
  <path d="M 6.7 28 Q 7 28 7.3 28" fill="none" stroke="#8B92A0" stroke-width="0.5" opacity="0.8"/>
  <path d="M 6.8 28.7 Q 7 28.7 7.2 28.7" fill="none" stroke="#8B92A0" stroke-width="0.5" opacity="0.8"/>
  
  <!-- Left shoe with flat sole - mid-height -->
  <rect x="4.5" y="29.5" width="5" height="2" rx="0.3" fill="#7C2D12"/>
  <path d="M 4.5 29.5 Q 4.5 28 6 27.8 L 8 27.8 Q 9.5 28 9.5 29.5 Z" fill="#DC2626"/>
  <path d="M 4.5 29.5 Q 4.5 28.3 6 28.2 L 8 28.2 Q 9.5 28.3 9.5 29.5 Z" fill="#EF4444"/>
  <ellipse cx="8.5" cy="28.5" rx="1" ry="0.8" fill="#FFFFFF" opacity="0.3"/>
  <line x1="5.5" y1="28.8" x2="8.5" y2="28.8" stroke="#B91C1C" stroke-width="0.5"/>
  
  <!-- Right leg - grounded with corrugated tube -->
  <path d="M 17 24 Q 17 26 16.5 28 L 16 30" fill="none" stroke="#5A6169" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="17" cy="26" r="1.5" fill="#374151"/>
  <!-- Corrugation lines -->
  <path d="M 16.2 24.5 Q 17 24.5 17.8 24.5" fill="none" stroke="#8B92A0" stroke-width="0.5" opacity="0.8"/>
  <path d="M 16.5 25.5 Q 17 25.5 17.5 25.5" fill="none" stroke="#8B92A0" stroke-width="0.5" opacity="0.8"/>
  <path d="M 16.5 26.8 Q 17 26.8 17.5 26.8" fill="none" stroke="#8B92A0" stroke-width="0.5" opacity="0.8"/>
  <path d="M 16.2 27.8 Q 16.6 27.8 17 27.8" fill="none" stroke="#8B92A0" stroke-width="0.5" opacity="0.8"/>
  <path d="M 16 28.8 Q 16.4 28.8 16.8 28.8" fill="none" stroke="#8B92A0" stroke-width="0.5" opacity="0.8"/>
  <path d="M 15.7 29.5 Q 16 29.5 16.3 29.5" fill="none" stroke="#8B92A0" stroke-width="0.5" opacity="0.8"/>
  
  <!-- Right shoe with flat sole - grounded -->
  <rect x="13.5" y="30.5" width="5" height="2" rx="0.3" fill="#7C2D12"/>
  <path d="M 13.5 30.5 Q 13.5 29 15 28.8 L 17 28.8 Q 18.5 29 18.5 30.5 Z" fill="#DC2626"/>
  <path d="M 13.5 30.5 Q 13.5 29.3 15 29.2 L 17 29.2 Q 18.5 29.3 18.5 30.5 Z" fill="#EF4444"/>
  <ellipse cx="17.5" cy="29.5" rx="1" ry="0.8" fill="#FFFFFF" opacity="0.3"/>
  <line x1="14.5" y1="29.8" x2="17.5" y2="29.8" stroke="#B91C1C" stroke-width="0.5"/>
  
  <!-- Main body - metallic sphere with more detail -->
  <defs>
    <radialGradient id="metalGradient">
      <stop offset="0%" style="stop-color:#B8C0D0;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#8B92A0;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#6B7280;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4B5563;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="shine">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <circle cx="12" cy="14" r="9.5" fill="url(#metalGradient)" stroke="#374151" stroke-width="1"/>
  
  <!-- Shine highlight -->
  <ellipse cx="9" cy="10" rx="4" ry="5" fill="url(#shine)"/>
  
  <!-- Central band curved -->
  <path d="M 3.5 14 Q 12 12.5 20.5 14" stroke="#374151" stroke-width="2" fill="none"/>
  <path d="M 3.5 14 Q 12 15.5 20.5 14" stroke="#374151" stroke-width="2" fill="none"/>
  
  <!-- Small bolts around central band -->
  <g>
    <circle cx="5" cy="14" r="0.8" fill="#2D3338"/>
    <circle cx="5" cy="14" r="0.5" fill="#374151"/>
    <line x1="4.7" y1="14" x2="5.3" y2="14" stroke="#1F2937" stroke-width="0.2"/>
  </g>
  <g>
    <circle cx="8.5" cy="13.3" r="0.8" fill="#2D3338"/>
    <circle cx="8.5" cy="13.3" r="0.5" fill="#374151"/>
    <line x1="8.2" y1="13.3" x2="8.8" y2="13.3" stroke="#1F2937" stroke-width="0.2"/>
  </g>
  <g>
    <circle cx="12" cy="13" r="0.8" fill="#2D3338"/>
    <circle cx="12" cy="13" r="0.5" fill="#374151"/>
    <line x1="11.7" y1="13" x2="12.3" y2="13" stroke="#1F2937" stroke-width="0.2"/>
  </g>
  <g>
    <circle cx="15.5" cy="13.3" r="0.8" fill="#2D3338"/>
    <circle cx="15.5" cy="13.3" r="0.5" fill="#374151"/>
    <line x1="15.2" y1="13.3" x2="15.8" y2="13.3" stroke="#1F2937" stroke-width="0.2"/>
  </g>
  <g>
    <circle cx="19" cy="14" r="0.8" fill="#2D3338"/>
    <circle cx="19" cy="14" r="0.5" fill="#374151"/>
    <line x1="18.7" y1="14" x2="19.3" y2="14" stroke="#1F2937" stroke-width="0.2"/>
  </g>
  <g>
    <circle cx="12" cy="15" r="0.8" fill="#2D3338"/>
    <circle cx="12" cy="15" r="0.5" fill="#374151"/>
    <line x1="11.7" y1="15" x2="12.3" y2="15" stroke="#1F2937" stroke-width="0.2"/>
  </g>
  
  <!-- Wind-up key on back - butterfly shape, yellow -->
  <g transform="translate(17, 14)">
    <!-- Key shaft -->
    <rect x="0" y="-0.8" width="1.5" height="1.6" rx="0.3" fill="#6B7280" stroke="#4B5563" stroke-width="0.5"/>
    <!-- Butterfly wings -->
    <path d="M 1.5 -2.5 Q 3 -2.5 4 -1.2 Q 3 0 1.5 0 Q 3 0 4 1.2 Q 3 2.5 1.5 2.5 L 1.5 -2.5 Z" fill="#FCD34D" stroke="#F59E0B" stroke-width="0.8"/>
    <path d="M 1.5 -2.5 L 1.5 2.5" stroke="#F59E0B" stroke-width="0.5"/>
    <circle cx="3" cy="-1.2" r="0.4" fill="#F59E0B"/>
    <circle cx="3" cy="1.2" r="0.4" fill="#F59E0B"/>
  </g>
  
  <!-- Antenna on head - shorter -->
  <line x1="12" y1="5.5" x2="12" y2="3.5" stroke="#5A6169" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="12" cy="3.5" r="0.8" fill="#4B5563"/>
  <circle cx="12" cy="3" r="1.5" fill="#DC2626"/>
  <circle cx="12" cy="3" r="1.1" fill="#EF4444"/>
  <ellipse cx="11.3" cy="2.8" rx="0.5" ry="0.3" fill="#FFFFFF" opacity="0.4"/>
</svg>
