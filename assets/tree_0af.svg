  <rect x="22" y="36" width="3" height="2" rx="0.5" fill="#2A2A2A"/>
  
  <!-- Light blue leaves clusters -->
  <ellipse cx="11" cy="16" rx="5" ry="4" fill="#00AAFF" opacity="0.4"/>
  <ellipse cx="17" cy="10" rx="6" ry="5" fill="#00AAFF" opacity="0.5"/>
  <ellipse cx="23" cy="18" rx="5" ry="4" fill="#00AAFF" opacity="0.4"/>
