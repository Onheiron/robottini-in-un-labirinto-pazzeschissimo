  <rect x="10" y="18" width="3" height="30" rx="1.5" fill="#E8E8E0"/>
  <rect x="16" y="12" width="3" height="36" rx="1.5" fill="#F0F0E8"/>
  <rect x="22" y="20" width="3" height="28" rx="1.5" fill="#E8E8E0"/>
  
  <!-- Black birch marks -->
  <rect x="10" y="24" width="3" height="2" rx="0.5" fill="#2A2A2A"/>
  <rect x="10" y="32" width="3" height="1.5" rx="0.5" fill="#2A2A2A"/>
  <rect x="10" y="40" width="3" height="2" rx="0.5" fill="#2A2A2A"/>
  <rect x="16" y="20" width="3" height="2" rx="0.5" fill="#2A2A2A"/>
  <rect x="16" y="28" width="3" height="1.5" rx="0.5" fill="#2A2A2A"/>
  <rect x="16" y="38" width="3" height="2" rx="0.5" fill="#2A2A2A"/>
