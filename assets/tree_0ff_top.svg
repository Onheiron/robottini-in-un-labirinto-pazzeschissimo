<!-- Tree 0ff_top - Cyan themed tropical fern (chioma - parte superiore) -->
<svg width="32" height="24" viewBox="0 0 32 24" xmlns="http://www.w3.org/2000/svg">
  <!-- Central stem -->
  <rect x="15" y="8" width="2" height="16" rx="1" fill="#3A5A3A"/>
  
  <!-- Fern fronds - alternating pattern -->
  <path d="M 16 12 Q 10 12 6 10 Q 8 11 10 12 Q 12 13 16 14" fill="#2A6A4A"/>
  <path d="M 16 12 Q 8 12 4 10 Q 6 11 8 12 Q 10 13 16 14" fill="#1A5A3A"/>
  
  <path d="M 16 18 Q 22 18 26 16 Q 24 17 22 18 Q 20 19 16 20" fill="#2A6A4A"/>
  <path d="M 16 18 Q 24 18 28 16 Q 26 17 24 18 Q 22 19 16 20" fill="#1A5A3A"/>
  
  <!-- Cyan highlights on fronds -->
  <path d="M 16 12 Q 10 12 6 10" stroke="#00FFFF" stroke-width="1" fill="none"/>
  <path d="M 16 18 Q 22 18 26 16" stroke="#00FFFF" stroke-width="1" fill="none"/>
  
  <!-- Cyan spores -->
  <circle cx="8" cy="10" r="1" fill="#00FFFF"/>
  <circle cx="24" cy="16" r="1" fill="#00FFFF"/>
  <circle cx="8" cy="22" r="1" fill="#00FFFF"/>
</svg>
