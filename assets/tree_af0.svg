  <ellipse cx="16" cy="32" rx="7" ry="16" fill="#4A7C3A"/>
  <ellipse cx="16" cy="30" rx="6.5" ry="14" fill="#5A8C4A"/>
  
  <!-- Side arms -->
  <ellipse cx="9" cy="26" rx="3" ry="8" fill="#4A7C3A"/>
  <ellipse cx="9" cy="25" rx="2.5" ry="7" fill="#5A8C4A"/>
