  <ellipse cx="23" cy="27" rx="2.5" ry="6" fill="#5A8C4A"/>
  
  <!-- Lime green spikes -->
  <path d="M 12 20 L 11 18 L 10 20" fill="#AAFF00"/>
  <path d="M 16 18 L 15 16 L 14 18" fill="#AAFF00"/>
  <path d="M 20 20 L 19 18 L 18 20" fill="#AAFF00"/>
  <path d="M 14 28 L 13 26 L 12 28" fill="#AAFF00"/>
