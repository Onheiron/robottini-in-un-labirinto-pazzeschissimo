<!-- Tree af0_top - Lime/yellow-green themed spiky cactus (chioma - parte superiore) -->
<svg width="32" height="24" viewBox="0 0 32 24" xmlns="http://www.w3.org/2000/svg">
  <!-- Main cactus body upper part -->
  <ellipse cx="16" cy="32" rx="7" ry="16" fill="#4A7C3A"/>
  <ellipse cx="16" cy="30" rx="6.5" ry="14" fill="#5A8C4A"/>
  
  <!-- Lime green spikes -->
  <path d="M 12 20 L 11 18 L 10 20" fill="#AAFF00"/>
  <path d="M 16 18 L 15 16 L 14 18" fill="#AAFF00"/>
  <path d="M 20 20 L 19 18 L 18 20" fill="#AAFF00"/>
  
  <!-- Yellow-green flower on top -->
  <circle cx="16" cy="16" r="3" fill="#DDFF55"/>
  <circle cx="16" cy="16" r="1.5" fill="#FFFF88"/>
</svg>
