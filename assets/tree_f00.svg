  <rect x="14" y="25" width="4" height="22" rx="1.5" fill="#8B5A2B"/>
  
  <!-- Large rounded canopy -->
  <ellipse cx="16" cy="18" rx="12" ry="10" fill="#5A4A2A"/>
  <ellipse cx="16" cy="16" rx="11" ry="9" fill="#6B5A3A"/>
  
  <!-- Red maple leaves scattered -->
  <path d="M 10 14 L 12 16 L 10 18 L 8 16 Z" fill="#FF0000"/>
  <path d="M 16 10 L 18 12 L 16 14 L 14 12 Z" fill="#FF0000"/>
  <path d="M 22 14 L 24 16 L 22 18 L 20 16 Z" fill="#FF0000"/>
