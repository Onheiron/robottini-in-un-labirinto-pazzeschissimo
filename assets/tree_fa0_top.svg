  <defs>
    <radialGradient id="trunkGrad_fa0">
      <stop offset="0%" style="stop-color:#8B7355;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5D4E37;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Trunk segment in top part -->
  <rect x="13" y="18" width="6" height="6" rx="2" fill="url(#trunkGrad_fa0)"/>
  <ellipse cx="16" cy="22" rx="4" ry="1.5" fill="#6B5D4A"/>
  
  <!-- Palm fronds with orange accents -->
