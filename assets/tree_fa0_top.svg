  <path d="M 16 18 Q 10 12 6 6" stroke="#FFAA00" stroke-width="1" fill="none"/>
  <path d="M 16 18 Q 22 12 26 6" stroke="#FFAA00" stroke-width="1" fill="none"/>
  
  <!-- Orange fruits -->
