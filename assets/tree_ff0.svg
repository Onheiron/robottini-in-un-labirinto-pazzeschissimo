<!-- Tree ff0 - Yellow themed sunflower tree -->
<svg width="32" height="48" viewBox="0 0 32 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Thick green stem -->
  <rect x="14" y="16" width="4" height="32" rx="2" fill="#4A7A3A"/>
  <rect x="14.5" y="16" width="3" height="31" rx="1.5" fill="#5A8A4A"/>
  
  <!-- Leaves on stem -->
  <ellipse cx="12" cy="24" rx="4" ry="2" fill="#3A6A2A"/>
  <ellipse cx="20" cy="28" rx="4" ry="2" fill="#3A6A2A"/>
  <ellipse cx="11" cy="34" rx="4" ry="2" fill="#3A6A2A"/>
  <ellipse cx="21" cy="38" rx="4" ry="2" fill="#3A6A2A"/>
  
  <!-- Large sunflower head -->
  <circle cx="16" cy="12" r="8" fill="#FFFF00"/>
  
  <!-- Yellow petals -->
  <ellipse cx="16" cy="4" rx="2.5" ry="4" fill="#FFFF00"/>
  <ellipse cx="16" cy="20" rx="2.5" ry="4" fill="#FFFF00"/>
  <ellipse cx="8" cy="12" rx="4" ry="2.5" fill="#FFFF00"/>
  <ellipse cx="24" cy="12" rx="4" ry="2.5" fill="#FFFF00"/>
  <ellipse cx="10" cy="6" rx="3" ry="3" fill="#FFEE00" transform="rotate(-45 10 6)"/>
  <ellipse cx="22" cy="6" rx="3" ry="3" fill="#FFEE00" transform="rotate(45 22 6)"/>
  <ellipse cx="10" cy="18" rx="3" ry="3" fill="#FFEE00" transform="rotate(45 10 18)"/>
  <ellipse cx="22" cy="18" rx="3" ry="3" fill="#FFEE00" transform="rotate(-45 22 18)"/>
  
  <!-- Brown center -->
  <circle cx="16" cy="12" r="4" fill="#654321"/>
  
  <!-- Seeds pattern -->
  <circle cx="14" cy="10" r="0.8" fill="#4A3B2A"/>
  <circle cx="18" cy="10" r="0.8" fill="#4A3B2A"/>
  <circle cx="14" cy="14" r="0.8" fill="#4A3B2A"/>
  <circle cx="18" cy="14" r="0.8" fill="#4A3B2A"/>
  <circle cx="16" cy="12" r="0.8" fill="#4A3B2A"/>
</svg>
