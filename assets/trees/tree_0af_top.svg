<!-- Tree 0af_top - Sky blue themed birch cluster (chioma - parte superiore) -->
<svg width="32" height="24" viewBox="0 0 32 24" xmlns="http://www.w3.org/2000/svg">
  <!-- Multiple thin birch trunks upper parts -->
  <rect x="10" y="18" width="3" height="6" rx="1.5" fill="#E8E8E0"/>
  <rect x="16" y="12" width="3" height="12" rx="1.5" fill="#F0F0E8"/>
  <rect x="22" y="20" width="3" height="4" rx="1.5" fill="#E8E8E0"/>
  
  <!-- Black birch marks -->
  <rect x="16" y="20" width="3" height="2" rx="0.5" fill="#2A2A2A"/>
  
  <!-- Light blue leaves clusters -->
  <ellipse cx="11" cy="16" rx="5" ry="4" fill="#00AAFF"/>
  <ellipse cx="17" cy="10" rx="6" ry="5" fill="#00AAFF"/>
  <ellipse cx="23" cy="18" rx="5" ry="4" fill="#00AAFF"/>
  <ellipse cx="9" cy="12" rx="3" ry="3" fill="#55CCFF"/>
  <ellipse cx="20" cy="6" rx="4" ry="3" fill="#55CCFF"/>
  <ellipse cx="25" cy="14" rx="3" ry="3" fill="#55CCFF"/>
</svg>
