<!-- Tree 0ff - Cyan themed tropical fern -->
<svg width="32" height="48" viewBox="0 0 32 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Central stem -->
  <rect x="15" y="8" width="2" height="40" rx="1" fill="#3A5A3A"/>
  
  <!-- Fern fronds - alternating pattern -->
  <path d="M 16 12 Q 10 12 6 10 Q 8 11 10 12 Q 12 13 16 14" fill="#2A6A4A"/>
  <path d="M 16 12 Q 8 12 4 10 Q 6 11 8 12 Q 10 13 16 14" fill="#1A5A3A" opacity="0.8"/>
  
  <path d="M 16 18 Q 22 18 26 16 Q 24 17 22 18 Q 20 19 16 20" fill="#2A6A4A"/>
  <path d="M 16 18 Q 24 18 28 16 Q 26 17 24 18 Q 22 19 16 20" fill="#1A5A3A" opacity="0.8"/>
  
  <path d="M 16 24 Q 10 24 6 22 Q 8 23 10 24 Q 12 25 16 26" fill="#2A6A4A"/>
  <path d="M 16 30 Q 22 30 26 28 Q 24 29 22 30 Q 20 31 16 32" fill="#2A6A4A"/>
  <path d="M 16 36 Q 10 36 6 34 Q 8 35 10 36 Q 12 37 16 38" fill="#2A6A4A"/>
  <path d="M 16 42 Q 22 42 26 40 Q 24 41 22 42 Q 20 43 16 44" fill="#2A6A4A"/>
  
  <!-- Cyan highlights on fronds -->
  <path d="M 16 12 Q 10 12 6 10" stroke="#00FFFF" stroke-width="1" fill="none" opacity="0.6"/>
  <path d="M 16 18 Q 22 18 26 16" stroke="#00FFFF" stroke-width="1" fill="none" opacity="0.6"/>
  <path d="M 16 24 Q 10 24 6 22" stroke="#00FFFF" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M 16 30 Q 22 30 26 28" stroke="#00FFFF" stroke-width="1" fill="none" opacity="0.5"/>
  
  <!-- Cyan spores -->
  <circle cx="8" cy="10" r="1" fill="#00FFFF"/>
  <circle cx="24" cy="16" r="1" fill="#00FFFF"/>
  <circle cx="8" cy="22" r="1" fill="#00FFFF"/>
  <circle cx="24" cy="28" r="1" fill="#00FFFF"/>
</svg>
