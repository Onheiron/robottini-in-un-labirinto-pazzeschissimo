<!-- Tree f0a_top - Pink/Magenta themed weeping willow (chioma - parte superiore) -->
<svg width="32" height="24" viewBox="0 0 32 24" xmlns="http://www.w3.org/2000/svg">
  <!-- Trunk - thin and elegant -->
  <path d="M 16 24 Q 16 20 15.5 10 Q 16 5 16 0" stroke="#654321" stroke-width="3" fill="none"/>
  
  <!-- Drooping branches upper parts -->
  <path d="M 15 12 Q 10 18 8 24" stroke="#3A5F3A" stroke-width="2" fill="none"/>
  <path d="M 16 10 Q 12 16 10 24" stroke="#3A5F3A" stroke-width="1.5" fill="none"/>
  <path d="M 17 12 Q 22 18 24 24" stroke="#3A5F3A" stroke-width="2" fill="none"/>
  <path d="M 16 10 Q 20 16 22 24" stroke="#3A5F3A" stroke-width="1.5" fill="none"/>
  
  <!-- Pink/magenta blossoms -->
  <circle cx="16" cy="14" r="1.5" fill="#FF00AA"/>
  <circle cx="14" cy="18" r="1.2" fill="#FF33BB"/>
  <circle cx="18" cy="18" r="1.2" fill="#FF33BB"/>
</svg>
